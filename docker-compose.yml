services:
  api:
    build: .
    image: credit-risk-scorer
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
  dashboard:
    image: credit-risk-scorer
    depends_on:
      api:
        condition: service_healthy
    environment:
      SCORER_API_URL: http://api:8000
    command:
      [
        "streamlit",
        "run",
        "app.py",
        "--server.address",
        "0.0.0.0",
        "--server.port",
        "8501",
      ]
    ports:
      - "8501:8501"
